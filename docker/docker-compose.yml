version: '3.9'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: dreammakeovers
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/dreammakeovers
    ports: ["8000:8000"]
    depends_on: [db]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  postgres_data:
